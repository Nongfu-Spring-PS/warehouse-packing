<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>打包 Packing</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f0f0ed; --line: #e3e3de;
    --text: #1d1d1b; --muted: #6b6b66; --accent: #1d1d1b; --accent-text: #ffffff;
    --warn-bg: #fff4e0; --warn: #8a5a00; --ok-bg: #e7f5ec; --ok: #1f6b3a;
    --info-bg: #e8f0fb; --info: #24508f; --danger: #a8322a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1e1e1c; --surface-2: #262624; --line: #33332f;
      --text: #ededea; --muted: #a0a09a; --accent: #ededea; --accent-text: #151514;
      --warn-bg: #3a2c12; --warn: #f0c26b; --ok-bg: #173323; --ok: #8fd9a8;
      --info-bg: #1b2a40; --info: #9cc0f0; --danger: #f08b82; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); padding: 7px 14px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; outline: none; }
  input:focus { border-color: var(--muted); }
  .zh { font-weight: 650; }
  .en { color: var(--muted); font-size: 12px; font-weight: 400; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { font-size: 16px; }
  .counts { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .count b { font-size: 20px; margin-right: 4px; }
  .meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; padding: 16px 24px 0; }
  .bar input[type=search] { flex: 1; min-width: 240px; font-size: 16px; padding: 10px 14px; }
  .packer { display: flex; align-items: center; gap: 8px; }
  .packer input { width: 140px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
    max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow); display: flex; flex-direction: column; transition: opacity .25s, transform .25s; }
  .item.done { opacity: 0; transform: scale(.96); }
  .photo { aspect-ratio: 1 / 1; background: #fff; display: flex; align-items: center; justify-content: center; }
  .photo img { width: 100%; height: 100%; object-fit: contain; }
  .photo .none { color: #6b6b66; text-align: center; }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .prod { font-size: 17px; line-height: 1.3; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ordno { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--info-bg); color: var(--info); font-weight: 600; }
  .trk { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  .qty { background: var(--warn-bg); color: var(--warn); font-weight: 700; border-radius: 8px; padding: 2px 10px; font-size: 18px; }
  .box { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
  .box b { color: var(--text); font-weight: 600; }
  .packed { font-size: 13px; color: var(--ok); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; }
  .btns button { padding: 12px 8px; line-height: 1.2; }
  .btns button .en { display: block; }
  .btns button.primary .en { color: inherit; opacity: .75; }
  .empty { grid-column: 1 / -1; padding: 48px 16px; text-align: center; color: var(--muted); }
  #printFrame { position: fixed; right: 0; bottom: 0; width: 0; height: 0; border: 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent);
    color: var(--accent-text); padding: 10px 16px; border-radius: 10px; display: none; gap: 14px; align-items: center;
    z-index: 10; max-width: calc(100% - 32px); }
  #toast.show { display: flex; }
  #toast.error { background: var(--danger); }
  #toast button { background: transparent; color: var(--accent-text); border-color: currentColor; padding: 3px 10px; }
  @media (max-width: 640px) { .top, .bar, .grid { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="zh">打包</span> <span class="en">Packing</span></div>
    <div class="counts">
      <span class="count"><b id="nQueue">–</b><span class="zh">待打包</span> <span class="en">to pack</span></span>
      <span class="count"><b id="nDone">–</b><span class="zh">今日已打包</span> <span class="en">packed today</span></span>
    </div>
    <div class="meta"><span id="updated"></span><button id="refresh"><span class="zh">刷新</span> <span class="en">Refresh</span></button></div>
  </header>
  <div class="bar">
    <input type="search" id="q" placeholder="扫描或输入订单号 / 跟踪号   Scan or type order / tracking">
    <div class="tabs">
      <button id="tabQueue" class="on"><span class="zh">待打包</span> <span class="en">To pack</span></button>
      <button id="tabPacked"><span class="zh">已打包</span> <span class="en">Packed</span></button>
    </div>
    <label class="packer"><span><span class="zh">打包员</span> <span class="en">Packer</span></span>
      <input type="text" id="packer" placeholder="名字 Name"></label>
  </div>
  <main class="grid" id="grid"><div class="empty">…</div></main>
  <iframe id="printFrame" title="label"></iframe>
  <div id="toast"></div>
<script>
(function () {
  // The key travels only in the URL fragment (#k=...), which the browser never sends to the server.
  var state = {orders: [], products: {}, key: null, tab: 'queue', printed: {}, packed: {}};
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  state.packed = store.get('packed', {});
  state.printed = store.get('printed', {});
  var $ = function (id) { return document.getElementById(id); };
  $('packer').value = store.get('packer', '');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function toast(html, isError, undoKey) {
    var t = $('toast');
    t.innerHTML = html + (undoKey ? '<button data-undo="' + esc(undoKey) + '">撤销 Undo</button>' : '');
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, undoKey ? 8000 : 4000);
  }
  function b64url(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function getKey() {
    var m = /(?:^#|&)k=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return Promise.reject(new Error('no key'));
    return crypto.subtle.importKey('raw', b64url(m[1]), 'AES-GCM', false, ['decrypt']);
  }
  function fetchDecrypt(path) {
    return fetch(path + '?v=' + Date.now(), {cache: 'no-store'}).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer();
    }).then(function (buf) {
      var bytes = new Uint8Array(buf);
      return crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes.slice(0, 12)}, state.key, bytes.slice(12));
    });
  }

  function load() {
    $('updated').textContent = '…';
    return fetchDecrypt('data.bin').then(function (buf) {
      var d = JSON.parse(new TextDecoder().decode(buf));
      state.orders = d.orders; state.products = d.products || {};
      $('updated').textContent = d.generated_at.slice(5, 16).replace('T', ' ');
      render();
    }).catch(function (e) {
      $('grid').innerHTML = '<div class="empty"><div class="zh">链接无效或数据无法读取</div><div class="en">Link not valid or data unreadable</div></div>';
      $('updated').textContent = '';
    });
  }

  function render() {
    var t = today();
    var queue = state.orders.filter(function (o) { return !state.packed[o.key]; });
    var done = state.orders.filter(function (o) { return state.packed[o.key]; })
      .sort(function (a, b) { return state.packed[a.key].at < state.packed[b.key].at ? 1 : -1; });
    $('nQueue').textContent = queue.length;
    $('nDone').textContent = done.filter(function (o) { return state.packed[o.key].at.slice(0, 10) === t; }).length;
    $('tabQueue').className = state.tab === 'queue' ? 'on' : '';
    $('tabPacked').className = state.tab === 'packed' ? 'on' : '';
    var q = $('q').value.trim().toLowerCase().replace(/^#/, '');
    var list = (state.tab === 'queue' ? queue : done).filter(function (o) {
      return !q || [o.order_no.replace('#', ''), o.key, o.tracking, o.product, o.catalog].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    $('grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty"><div class="zh">' +
      (state.tab === 'queue' ? '没有待打包的订单' : '还没有已打包的订单') + '</div><div class="en">' +
      (state.tab === 'queue' ? 'Nothing to pack' : 'Nothing packed yet') + '</div></div>';
  }

  function card(o) {
    var p = state.products[o.catalog] || {};
    var printed = !!state.printed[o.key], packed = state.packed[o.key];
    var photo = p.photo ? '<img src="' + p.photo + '" alt="">' : '<div class="none"><div class="zh">无图片</div><div class="en">No photo</div></div>';
    var printBtn = o.label
      ? '<button class="' + (printed || packed ? '' : 'primary') + '" data-print="' + esc(o.key) + '"><span class="zh">' +
        (printed ? '重新打印' : '打印面单') + '</span><span class="en">' + (printed ? 'Reprint label' : 'Print label') + '</span></button>'
      : '<button disabled><span class="zh">面单未就绪</span><span class="en">Label not ready</span></button>';
    var second = packed
      ? '<button data-unpack="' + esc(o.key) + '"><span class="zh">撤销打包</span><span class="en">Undo packed</span></button>'
      : '<button class="' + (printed ? 'primary' : '') + '" data-pack="' + esc(o.key) + '"' + (printed ? '' : ' disabled') +
        '><span class="zh">确认已打包</span><span class="en">Confirm packed</span></button>';
    var units = parseInt(o.units, 10) > 1 ? ' <span class="qty">× ' + esc(o.units) + '</span>' : '';
    return '<article class="item" id="item-' + esc(o.key) + '"><div class="photo">' + photo + '</div><div class="body">' +
      '<div class="prod">' + (p.name_zh ? '<div class="zh">' + esc(p.name_zh) + '</div>' : '') +
      '<div class="' + (p.name_zh ? 'en' : 'zh') + '">' + esc(o.product) + '</div></div>' +
      '<div class="row"><span class="ordno">' + esc(o.order_no) + '</span><span class="chip">' + esc(o.store) + '</span></div>' +
      '<div class="row"><span>' + esc(o.country) + units + '</span><span class="trk">' + (o.tracking ? '…' + esc(o.tracking.slice(-6)) : '') + '</span></div>' +
      (o.in_box ? '<div class="box"><b>箱内 In the box:</b> ' + esc(o.in_box) + '</div>' : '') +
      (packed ? '<div class="packed">✓ ' + esc(packed.by) + ' · ' + esc(packed.at.slice(5, 16).replace('T', ' ')) + '</div>' : '') +
      '</div><div class="btns">' + printBtn + second + '</div></article>';
  }

  function printLabel(key, btn) {
    var o = state.orders.filter(function (x) { return x.key === key; })[0];
    btn.disabled = true;
    fetchDecrypt('labels/' + o.label + '.bin').then(function (buf) {
      var url = URL.createObjectURL(new Blob([buf], {type: 'image/png'}));
      var frame = $('printFrame');
      frame.onload = function () {
        var img = frame.contentDocument.querySelector('img');
        var go = function () {
          frame.contentWindow.focus(); frame.contentWindow.print();
          state.printed[key] = true; store.set('printed', state.printed); render();
        };
        if (img.complete) go(); else img.onload = go;
      };
      frame.srcdoc = '<!DOCTYPE html><html><head><style>@page{size:100mm 100mm;margin:0}html,body{margin:0}' +
        'img{width:100mm;height:100mm;object-fit:contain;display:block}</style></head><body><img src="' + url + '"></body></html>';
    }).catch(function () { btn.disabled = false; toast('面单读取失败 · Could not load the label', true); });
  }

  function confirmPacked(key) {
    var who = $('packer').value.trim();
    if (!who) { toast('请先输入打包员名字 · Enter the packer name first', true); $('packer').focus(); return; }
    var d = new Date(), at = today() + 'T' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var el = $('item-' + key); if (el) el.classList.add('done');
    setTimeout(function () {
      state.packed[key] = {at: at, by: who}; store.set('packed', state.packed); render();
    }, 250);
    var o = state.orders.filter(function (x) { return x.key === key; })[0];
    toast('已打包 Packed ' + esc(o ? o.order_no : key), false, key);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.print) printLabel(t.dataset.print, t);
    else if (t.dataset.pack) confirmPacked(t.dataset.pack);
    else if (t.dataset.undo || t.dataset.unpack) {
      delete state.packed[t.dataset.undo || t.dataset.unpack]; store.set('packed', state.packed);
      toast('已撤销 Undone'); render();
    }
    else if (t.id === 'refresh') load();
    else if (t.closest('#tabQueue')) { state.tab = 'queue'; render(); }
    else if (t.closest('#tabPacked')) { state.tab = 'packed'; render(); }
  });
  $('q').addEventListener('input', render);
  $('packer').addEventListener('change', function (e) { store.set('packer', e.target.value.trim()); });

  if (!window.crypto || !crypto.subtle) {
    $('grid').innerHTML = '<div class="empty">请使用最新版 Chrome · Please use a recent Chrome</div>';
    return;
  }
  getKey().then(function (k) { state.key = k; return load(); }).catch(function () {
    $('grid').innerHTML = '<div class="empty"><div class="zh">链接无效</div><div class="en">Link not valid</div></div>';
  });
  setInterval(function () { if (!document.hidden && state.key) load(); }, 300000);
})();
</script>
</body>
</html>
