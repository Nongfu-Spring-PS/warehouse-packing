<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>打包 Packing</title>
<style>
  :root {
    --bg: #f4f4f1; --surface: #ffffff; --surface-2: #efefea; --line: #e2e2dc;
    --text: #1b1b19; --muted: #6b6b66; --accent: #1b1b19; --accent-text: #ffffff;
    --ok: #1f7a43; --ok-bg: #e3f4e9; --warn: #8a5a00; --warn-bg: #fff2d9; --bad: #b3261e; --bad-bg: #fde7e5;
    --active: #2563eb; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 10px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --line: #34342f;
      --text: #ededea; --muted: #a3a39c; --accent: #ededea; --accent-text: #141413;
      --ok: #7fd6a1; --ok-bg: #16301f; --warn: #f0c26b; --warn-bg: #352812; --bad: #f2948b; --bad-bg: #3a1714;
      --active: #7aa7ff; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); padding: 8px 14px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  small, .en { color: var(--muted); font-size: 12px; font-weight: 400; }
  button.primary small { color: inherit; opacity: .7; }

  .top { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: auto 1fr auto; gap: 16px;
    align-items: center; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { font-size: 18px; font-weight: 700; white-space: nowrap; }
  .scan { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 2px solid var(--line);
    border-radius: 12px; padding: 6px 12px; }
  .scan:focus-within { border-color: var(--active); }
  .scan svg { flex: none; }
  .scan input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 20px;
    padding: 6px 0; min-width: 0; font-family: ui-monospace, Consolas, monospace; letter-spacing: .5px; }
  .right { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .progress { text-align: right; }
  .progress b { font-size: 22px; }
  .bar { height: 6px; width: 160px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }

  #banner { grid-column: 1 / -1; display: none; margin: 0; padding: 12px 18px; border-radius: 12px; font-size: 20px;
    font-weight: 700; align-items: center; gap: 14px; flex-wrap: wrap; }
  #banner.show { display: flex; }
  #banner.ok { background: var(--ok-bg); color: var(--ok); }
  #banner.warn { background: var(--warn-bg); color: var(--warn); }
  #banner.bad { background: var(--bad-bg); color: var(--bad); }
  #banner.info { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  #banner .msg { flex: 1; min-width: 240px; }
  #banner .msg small { display: block; color: inherit; opacity: .8; font-size: 14px; font-weight: 500; }
  #banner button { font-size: 14px; }

  main { max-width: 1280px; margin: 0 auto; padding: 16px 24px 80px; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 22px 0 10px; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); text-align: left; }
  .pill img { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: #fff; }
  .pill b { font-size: 18px; margin-left: 4px; }

  .group { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    margin-bottom: 14px; overflow: hidden; }
  .group.active { border-color: var(--active); }
  .g-head { display: grid; grid-template-columns: 112px 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; }
  .g-photo { width: 112px; height: 112px; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid var(--line); }
  .g-title .zh { font-size: 24px; font-weight: 800; line-height: 1.25; }
  .colour { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; margin-left: 6px;
    padding: 2px 12px 2px 6px; border-radius: 99px; background: var(--surface-2); vertical-align: middle; }
  .colour i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(128,128,128,.5); }
  .units { display: inline-block; background: var(--bad); color: #fff; font-size: 18px; font-weight: 800;
    border-radius: 8px; padding: 2px 10px; margin-left: 6px; vertical-align: middle; }
  .g-count { text-align: center; }
  .g-count b { font-size: 34px; display: block; line-height: 1; }
  .g-print { padding: 12px 18px; font-size: 17px; font-weight: 700; }
  .g-print small { display: block; }
  .box { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 16px 12px; }
  .box > span:first-child { font-weight: 700; margin-right: 4px; }
  .item { background: var(--surface-2); border-radius: 8px; padding: 4px 10px; font-size: 16px; font-weight: 600; }
  .item small { margin-left: 4px; }
  .item.none { background: var(--bad-bg); color: var(--bad); text-decoration: none; }
  .orders { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 16px; border-top: 1px dashed var(--line); }
  .ord { min-width: 112px; text-align: left; padding: 6px 12px; }
  .ord b { font-size: 17px; display: block; }
  .ord.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
  .ord.done b::before { content: "✓ "; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-top: 14px; }
  summary { cursor: pointer; padding: 12px 16px; font-weight: 700; }
  .rows { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row .grow { flex: 1; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 18px; }
  #menu { position: fixed; z-index: 20; display: none; flex-direction: column; gap: 6px; padding: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  #menu.show { display: flex; }
  #menu button { text-align: left; }
  #printFrame { position: fixed; right: 0; bottom: 0; width: 0; height: 0; border: 0; }
  @media (max-width: 900px) {
    .top { grid-template-columns: 1fr; padding: 10px 16px; }
    main { padding: 12px 16px 60px; }
    .g-head { grid-template-columns: 72px 1fr; } .g-photo { width: 72px; height: 72px; }
    .g-count, .g-print { grid-column: span 1; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">打包 <small>Packing</small></div>
  <label class="scan" title="扫描面单条码">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M15 8v8M18 8v8"/></svg>
    <input id="scan" autocomplete="off" spellcheck="false" placeholder="扫描面单条码  ·  Scan label barcode">
  </label>
  <div class="right">
    <div class="progress"><b id="nDone">0</b> / <span id="nAll">0</span> 已打包 <small>packed</small><div class="bar"><i id="barFill"></i></div></div>
    <button id="refresh">刷新 <small>Refresh</small></button>
  </div>
  <div id="banner"></div>
</header>
<main id="main"><div class="empty">…</div></main>
<div id="menu"></div>
<iframe id="printFrame" title="labels"></iframe>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var S = { key: null, orders: [], products: {}, packed: store.get('packed', {}), active: store.get('active', null),
            byCode: {}, ambiguous: {}, groups: [], generated: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function now() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function today() { return now().slice(0, 10); }

  // ---------- sound: short tones so the packer does not need to look at the screen ----------
  var audio;
  function tone(freq, ms, times) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      for (var i = 0; i < (times || 1); i++) {
        var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * (ms + 60) / 1000;
        o.frequency.value = freq; o.type = 'square'; g.gain.value = 0.08;
        o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + ms / 1000);
      }
    } catch (e) {}
  }
  var sound = { ok: function () { tone(1320, 90); }, warn: function () { tone(660, 120, 2); }, bad: function () { tone(180, 350); } };

  // ---------- decryption: the key is only in the #k= part of the link ----------
  function b64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function getKey() { var m = /(?:^#|&)k=([A-Za-z0-9_-]+)/.exec(location.hash);
    return m ? crypto.subtle.importKey('raw', b64url(m[1]), 'AES-GCM', false, ['decrypt']) : Promise.reject(new Error('no key')); }
  function fetchDecrypt(path) {
    return fetch(path + '?v=' + Date.now(), {cache: 'no-store'}).then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(function (buf) { var b = new Uint8Array(buf); return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, S.key, b.slice(12)); });
  }

  // ---------- data ----------
  function load() {
    return fetchDecrypt('data.bin').then(function (buf) {
      var d = JSON.parse(new TextDecoder().decode(buf));
      S.orders = d.orders; S.products = d.products || {}; S.generated = d.generated_at;
      index(); render(); focusScan();
    }).catch(function () {
      $('main').innerHTML = '<div class="empty">链接无效或数据无法读取<br><small>Link not valid or data unreadable</small></div>';
    });
  }
  function index() {
    S.byCode = {}; S.ambiguous = {};
    var codes = [];
    S.orders.forEach(function (o) {
      if (!o.label) return;
      [o.tracking, o.key].forEach(function (c) { if (c) { S.byCode[c.toUpperCase()] = o; codes.push(c.toUpperCase()); } });
    });
    codes.forEach(function (a) { codes.forEach(function (b) { if (a !== b && b.indexOf(a) === 0) S.ambiguous[a] = true; }); });
    var groups = {};
    S.orders.forEach(function (o) {
      if (!o.label) return;
      var g = groups[o.group] = groups[o.group] || {key: o.group, title_zh: o.title_zh, title_en: o.title_en, colour: o.colour,
        units: o.units, box: o.box, catalog: o.catalog, orders: []};
      g.orders.push(o);
    });
    S.groups = Object.keys(groups).map(function (k) { var g = groups[k];
      g.orders.sort(function (a, b) { return a.order_no < b.order_no ? -1 : 1; }); return g; });
    if (S.active && !groups[S.active]) setActive(null);
  }
  function remaining(g) { return g.orders.filter(function (o) { return !S.packed[o.key]; }); }
  function setActive(k) { S.active = k; store.set('active', k); }

  // ---------- rendering ----------
  function photo(g) { var p = S.products[g.catalog] || {}; return p.photo || ''; }
  function colourTag(c) { return c ? '<span class="colour"><i style="background:' + esc(c.hex) + '"></i>' + esc(c.zh) +
    ' <small>' + esc(c.en) + '</small></span>' : ''; }
  function unitsTag(n) { return n > 1 ? '<span class="units">每单 ×' + n + '</span>' : ''; }
  function boxHtml(items) {
    if (!items || !items.length) return '';
    return '<div class="box"><span>箱内 <small>In the box</small></span>' + items.map(function (i) {
      if (i.none) return '<span class="item none">✕ ' + esc(i.zh) + '</span>';
      return '<span class="item">' + esc(i.zh || i.en) + (i.qty > 1 ? ' ×' + i.qty : '') + (i.note ? '（' + esc(i.note) + '）' : '') +
        (i.zh ? '' : '') + '</span>';
    }).join('') + '</div>';
  }
  function render() {
    var ready = S.orders.filter(function (o) { return o.label; });
    var waiting = S.orders.filter(function (o) { return !o.label; });
    var doneAll = ready.filter(function (o) { return S.packed[o.key]; }).length;
    $('nDone').textContent = doneAll; $('nAll').textContent = ready.length;
    $('barFill').style.width = (ready.length ? doneAll * 100 / ready.length : 0) + '%';

    var open = S.groups.filter(function (g) { return remaining(g).length; });
    var closed = S.groups.filter(function (g) { return !remaining(g).length; });
    open.sort(function (a, b) {
      if (a.key === S.active) return -1; if (b.key === S.active) return 1;
      return remaining(b).length - remaining(a).length || (a.title_zh < b.title_zh ? -1 : 1);
    });
    var html = '';
    if (open.length) {
      html += '<h2>拣货单 Pick list — 先把这些拿到桌上 · bring these to the table</h2><div class="pick">' + open.map(function (g) {
        return '<button class="pill" data-goto="' + esc(g.key) + '">' + (photo(g) ? '<img src="' + photo(g) + '" alt="">' : '') +
          '<span>' + esc(g.title_zh) + (g.colour ? ' · ' + esc(g.colour.zh) : '') + (g.units > 1 ? ' · 每单×' + g.units : '') +
          '</span><b>×' + remaining(g).length * g.units + '</b></button>';
      }).join('') + '</div><h2>打包 Pack — 每组：打印面单 → 装箱 → 贴面单 → 扫描 · print → pack → stick → scan</h2>';
      html += open.map(groupHtml).join('');
    } else if (ready.length) {
      html += '<div class="empty">✓ 全部打包完成<br><small>Everything is packed</small></div>';
    } else {
      html += '<div class="empty">没有待打包的订单<br><small>Nothing to pack</small></div>';
    }
    var packedToday = ready.filter(function (o) { return S.packed[o.key] && S.packed[o.key].at.slice(0, 10) === today(); });
    if (packedToday.length) {
      html += '<details><summary>今日已打包 ' + packedToday.length + ' <small>Packed today</small></summary><div class="rows">' +
        packedToday.sort(function (a, b) { return S.packed[a.key].at < S.packed[b.key].at ? 1 : -1; }).map(function (o) {
          return '<div class="row"><b>' + esc(o.order_no) + '</b><span class="grow">' + esc(o.title_zh) + (o.colour ? ' · ' + esc(o.colour.zh) : '') +
            ' <small>' + esc(o.country) + '</small></span><small>✓ ' + esc(S.packed[o.key].at.slice(11)) +
            '</small><button data-reprint="' + esc(o.key) + '">重打面单 <small>Reprint</small></button><button data-undo="' + esc(o.key) + '">撤销 <small>Undo</small></button></div>';
        }).join('') + '</div></details>';
    }
    if (waiting.length) {
      html += '<details><summary>等待面单 ' + waiting.length + ' <small>Waiting for label — 暂时不能打包</small></summary><div class="rows">' +
        waiting.map(function (o) { return '<div class="row"><b>' + esc(o.order_no) + '</b><span class="grow">' + esc(o.title_zh) +
          (o.colour ? ' · ' + esc(o.colour.zh) : '') + '</span><small>' + esc(o.country) + '</small></div>'; }).join('') + '</div></details>';
    }
    $('main').innerHTML = html;
  }
  function groupHtml(g) {
    var left = remaining(g);
    return '<section class="group' + (g.key === S.active ? ' active' : '') + '" id="g-' + encodeURIComponent(g.key) + '">' +
      '<div class="g-head">' + (photo(g) ? '<img class="g-photo" src="' + photo(g) + '" alt="">' : '<div class="g-photo"></div>') +
      '<div class="g-title"><div class="zh">' + esc(g.title_zh) + colourTag(g.colour) + unitsTag(g.units) + '</div>' +
      '<div class="en">' + esc(g.title_en) + '</div></div>' +
      '<div class="g-count"><b>' + left.length + '</b><small>/ ' + g.orders.length + ' 待打包</small></div>' +
      '<button class="primary g-print" data-print="' + esc(g.key) + '">打印本组面单 ' + left.length + ' 张<small>Print ' + left.length + ' labels</small></button></div>' +
      boxHtml(g.box) +
      '<div class="orders">' + g.orders.map(function (o) {
        return '<button class="ord' + (S.packed[o.key] ? ' done' : '') + '" data-ord="' + esc(o.key) + '"><b>' + esc(o.order_no) +
          '</b><small>' + esc(o.country) + ' · …' + esc((o.tracking || '').slice(-4)) + '</small></button>';
      }).join('') + '</div></section>';
  }

  // ---------- banner ----------
  var bannerTimer;
  function banner(kind, msg, sub, actions) {
    var b = $('banner'); clearTimeout(bannerTimer);
    b.className = 'show ' + kind;
    b.innerHTML = '<div class="msg">' + msg + (sub ? '<small>' + sub + '</small>' : '') + '</div>' + (actions || '');
    if (kind === 'info') bannerTimer = setTimeout(function () { b.className = ''; }, 6000);
  }

  // ---------- printing: one print job per group ----------
  function printOrders(list, then) {
    if (!list.length) return;
    banner('info', '正在准备 ' + list.length + ' 张面单… <small>Preparing labels</small>');
    Promise.all(list.map(function (o) { return fetchDecrypt('labels/' + o.label + '.bin'); })).then(function (bufs) {
      var urls = bufs.map(function (b) { return URL.createObjectURL(new Blob([b], {type: 'image/png'})); });
      var frame = $('printFrame');
      frame.onload = function () {
        var imgs = [].slice.call(frame.contentDocument.images), left = imgs.length;
        var go = function () {
          frame.contentWindow.focus(); frame.contentWindow.print();
          setTimeout(function () { urls.forEach(URL.revokeObjectURL); }, 60000);
          if (then) then();
        };
        imgs.forEach(function (im) { if (im.complete) left--; else im.onload = im.onerror = function () { if (--left === 0) go(); }; });
        if (left === 0) go();
      };
      frame.srcdoc = '<!DOCTYPE html><html><head><style>@page{size:100mm 100mm;margin:0}html,body{margin:0}' +
        '.p{width:100mm;height:100mm;page-break-after:always;break-after:page;overflow:hidden}.p:last-child{page-break-after:auto;break-after:auto}' +
        'img{width:100mm;height:100mm;object-fit:contain;display:block}</style></head><body>' +
        urls.map(function (u) { return '<div class="p"><img src="' + u + '"></div>'; }).join('') + '</body></html>';
    }).catch(function () { banner('bad', '面单读取失败', 'Could not load the labels — 请刷新 Refresh'); sound.bad(); });
  }
  function printGroup(key) {
    var g = S.groups.filter(function (x) { return x.key === key; })[0]; if (!g) return;
    var left = remaining(g);
    printOrders(left, function () {
      setActive(key); render();
      var el = document.getElementById('g-' + encodeURIComponent(key));
      if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
      banner('info', '已发送 ' + left.length + ' 张面单到打印机 · 装箱 → 贴面单 → 扫描',
        'Sent ' + left.length + ' labels to the printer. Pack, stick the label, scan it.');
      focusScan();
    });
  }

  // ---------- scanning ----------
  function find(raw) {
    var v = raw.trim().toUpperCase().replace(/\s+/g, '');
    if (!v) return null;
    if (S.byCode[v]) return S.byCode[v];
    var digits = v.replace(/^#/, '');
    if (/^\d{3,}$/.test(digits)) {
      var hits = S.orders.filter(function (o) { return o.label && (o.order_no.replace('#', '') === digits ||
        (digits.length >= 4 && (o.tracking || '').slice(-digits.length) === digits)); });
      if (hits.length === 1) return hits[0];
    }
    return null;
  }
  function handle(raw) {
    var o = find(raw);
    $('scan').value = '';
    if (!o) { banner('bad', '✕ 找不到这个条码', 'Not found: ' + esc(raw.trim()) + ' — 请扫描面单上的条码 · scan the label barcode'); sound.bad(); return; }
    if (S.packed[o.key]) {
      banner('warn', '⚠ ' + esc(o.order_no) + ' 已经打包过', 'Already packed at ' + esc(S.packed[o.key].at.slice(11)));
      sound.warn(); return;
    }
    if (S.active && o.group !== S.active) {
      var cur = S.groups.filter(function (g) { return g.key === S.active; })[0];
      banner('bad', '✕ 面单不属于当前组！请检查包裹', 'This label (' + esc(o.order_no) + ') is for: ' + esc(o.title_zh) +
        (o.colour ? ' · ' + esc(o.colour.zh) : '') + ' — current group: ' + esc(cur ? cur.title_zh + (cur.colour ? ' · ' + cur.colour.zh : '') : ''),
        '<button data-force="' + esc(o.key) + '">仍标记已打包 <small>Mark anyway</small></button>');
      sound.bad(); return;
    }
    markPacked(o);
  }
  function markPacked(o) {
    S.packed[o.key] = {at: now()}; store.set('packed', S.packed);
    var g = S.groups.filter(function (x) { return x.key === o.group; })[0];
    var left = g ? remaining(g).length : 0;
    if (g && !left && S.active === g.key) setActive(null);
    render();
    banner('ok', '✓ ' + esc(o.order_no) + ' 已打包' + (g && !left ? ' · 本组完成！' : ' · 本组还剩 ' + left),
      esc(o.title_zh) + (o.colour ? ' · ' + esc(o.colour.zh) : '') + ' — ' + esc(o.country) + (g && !left ? ' · Group done' : ' · ' + left + ' left in this group'),
      '<button data-undo="' + esc(o.key) + '">撤销 <small>Undo</small></button>');
    sound.ok();
  }
  function undo(key) {
    delete S.packed[key]; store.set('packed', S.packed); render();
    banner('info', '已撤销 · Undone'); focusScan();
  }

  // ---------- small menu for an order chip ----------
  function openMenu(key, el) {
    var o = S.orders.filter(function (x) { return x.key === key; })[0]; if (!o) return;
    var m = $('menu'), r = el.getBoundingClientRect();
    m.innerHTML = '<div style="padding:4px 8px"><b>' + esc(o.order_no) + '</b> <small>' + esc(o.country) + ' · ' + esc(o.tracking) + '</small></div>' +
      '<button data-reprint="' + esc(key) + '">重打面单 <small>Reprint label</small></button>' +
      (S.packed[key] ? '<button data-undo="' + esc(key) + '">撤销打包 <small>Undo packed</small></button>'
                     : '<button data-force="' + esc(key) + '">标记已打包（条码坏了）<small>Mark packed — barcode unreadable</small></button>');
    m.style.left = Math.min(r.left, innerWidth - 300) + 'px'; m.style.top = (r.bottom + 6) + 'px';
    m.className = 'show';
  }
  function closeMenu() { $('menu').className = ''; }

  function focusScan() { $('scan').focus(); }

  // ---------- events ----------
  var scan = $('scan'), composing = false;
  scan.addEventListener('compositionstart', function () { composing = true;
    banner('warn', '请切换到英文输入法（按 Shift）', 'Chinese input method is on — press Shift, then scan again'); });
  scan.addEventListener('compositionend', function () { composing = false; tryAuto(); });
  scan.addEventListener('input', function () { if (!composing) tryAuto(); });
  function tryAuto() {
    // Scanners usually send Enter; an exact, unambiguous code is accepted even without it.
    var v = scan.value.trim().toUpperCase();
    if (S.byCode[v] && !S.ambiguous[v]) handle(v);
  }
  scan.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && scan.value.trim()) { e.preventDefault(); handle(scan.value); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!e.target.closest('#menu')) closeMenu();
    if (t) {
      if (t.dataset.print) printGroup(t.dataset.print);
      else if (t.dataset.ord) { openMenu(t.dataset.ord, t); return; }
      else if (t.dataset.reprint) { closeMenu(); var o = S.orders.filter(function (x) { return x.key === t.dataset.reprint; })[0];
        if (o) printOrders([o], function () { banner('info', '已重打 ' + esc(o.order_no) + ' 的面单', 'Label reprinted'); }); }
      else if (t.dataset.undo) { closeMenu(); undo(t.dataset.undo); }
      else if (t.dataset.force) { closeMenu(); var f = S.orders.filter(function (x) { return x.key === t.dataset.force; })[0]; if (f) markPacked(f); }
      else if (t.dataset.goto) { var el = document.getElementById('g-' + encodeURIComponent(t.dataset.goto)); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
      else if (t.id === 'refresh') load();
    }
    if (!e.target.closest('input, summary')) focusScan();
  });
  window.addEventListener('focus', focusScan);
  document.addEventListener('keydown', function (e) {
    // Any typing outside an input goes to the scan box, so a scan is never lost.
    if (e.key === 'Escape') { closeMenu(); return; }
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT')) return;
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) focusScan();
  });

  if (!window.crypto || !crypto.subtle) { $('main').innerHTML = '<div class="empty">请使用最新版 Chrome<br><small>Please use a recent Chrome</small></div>'; return; }
  getKey().then(function (k) { S.key = k; return load(); })
    .catch(function () { $('main').innerHTML = '<div class="empty">链接无效<br><small>Link not valid</small></div>'; });
  setInterval(function () { if (!document.hidden && S.key) load(); }, 300000);
})();
</script>
</body>
</html>
